services:
  app:
    container_name: oil-kastenliste-app
    image: ghcr.io/lordofreinkeness/oil-kastenliste:latest
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: kastenliste
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - nginx_proxy-network
    restart: unless-stopped

  db:
    container_name: oil-kastenliste-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kastenliste
    volumes:
      - kastenliste_db:/var/lib/postgresql/data
    labels:
      - "wud.tag.include=^17(-alpine)?$"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  backup:
    container_name: oil-kastenliste-backup
    image: ghcr.io/lordofreinkeness/oil-kastenliste-backup:latest
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_USER: postgres
      DB_NAME: kastenliste
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_RETAIN: ${BACKUP_RETAIN}
      BACKUP_PATH: /backups
    volumes:
      - ${BACKUP_HOST_PATH}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

volumes:
  kastenliste_db:

networks:
  internal:
  nginx_proxy-network:
    external: true
