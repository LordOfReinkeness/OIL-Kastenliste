openapi: 3.0.0
paths:
  /api/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Health
  /api/users:
    post:
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created
        '409':
          description: RZ ID already exists
      summary: Create a new user
      tags:
        - Users
    get:
      operationId: UsersController_findAll
      parameters: []
      responses:
        '200':
          description: List of users
      summary: List all users
      tags:
        - Users
  /api/users/lookup/{rzId}:
    get:
      operationId: UsersController_findByRzId
      parameters:
        - name: rzId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User ID and RZ ID
        '404':
          description: User not found
      summary: Look up user by RZ ID
      tags:
        - Users
  /api/users/{id}:
    get:
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User found
        '404':
          description: User not found
      summary: Get a user by UUID
      tags:
        - Users
    patch:
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated
        '404':
          description: User not found
      summary: Update a user
      tags:
        - Users
    delete:
      operationId: UsersController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found
      summary: Delete a user
      tags:
        - Users
  /api/meetings:
    post:
      operationId: MeetingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingDto'
      responses:
        '201':
          description: Meeting created
      summary: Create a new meeting
      tags:
        - Meetings
    get:
      operationId: MeetingsController_findAll
      parameters: []
      responses:
        '200':
          description: List of meetings
      summary: List all meetings
      tags:
        - Meetings
  /api/meetings/next:
    get:
      operationId: MeetingsController_findNext
      parameters: []
      responses:
        '200':
          description: Next meeting
        '404':
          description: No upcoming meeting
      summary: Get next upcoming meeting
      tags:
        - Meetings
  /api/meetings/{id}:
    get:
      operationId: MeetingsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting found
        '404':
          description: Meeting not found
      summary: Get a meeting by UUID
      tags:
        - Meetings
    patch:
      operationId: MeetingsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingDto'
      responses:
        '200':
          description: Meeting updated
        '404':
          description: Meeting not found
      summary: Update a meeting
      tags:
        - Meetings
    delete:
      operationId: MeetingsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting deleted
        '404':
          description: Meeting not found
      summary: Delete a meeting
      tags:
        - Meetings
  /api/meetings/{id}/attendance:
    get:
      operationId: AttendanceController_getAttendance
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting with attendance list
        '404':
          description: Meeting not found
      summary: Get attendance for all users
      tags:
        - Attendance
  /api/meetings/{id}/attendance/{userId}:
    patch:
      operationId: AttendanceController_patchAttendance
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttendanceDto'
      responses:
        '200':
          description: Updated attendance record
        '404':
          description: Meeting or user not found
      summary: Override attendance for a user
      tags:
        - Attendance
info:
  title: Kastenliste OIL
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    CreateUserDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        firstName:
          type: string
          example: Lukas
        lastName:
          type: string
          example: Reinke
      required:
        - rzId
        - firstName
        - lastName
    UpdateUserDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        firstName:
          type: string
          example: Lukas
        lastName:
          type: string
          example: Reinke
    CreateMeetingDto:
      type: object
      properties:
        date:
          type: string
          example: '2026-04-10T18:00:00Z'
        excuseDeadlineMinutes:
          type: number
          example: 60
        checkinDeadline:
          type: string
          example: '2026-04-10T20:00:00Z'
        question:
          type: string
          example: What was the main topic?
        answer:
          type: string
          example: deployment pipeline
        checkAnswer:
          type: boolean
          example: false
        maxRetries:
          type: number
          example: 3
      required:
        - date
        - excuseDeadlineMinutes
        - checkinDeadline
    UpdateMeetingDto:
      type: object
      properties:
        date:
          type: string
          example: '2026-04-10T18:00:00Z'
        excuseDeadlineMinutes:
          type: number
          example: 60
        checkinDeadline:
          type: string
          example: '2026-04-10T20:00:00Z'
        question:
          type: string
          example: What was the main topic?
        answer:
          type: string
          example: deployment pipeline
        checkAnswer:
          type: boolean
          example: false
        maxRetries:
          type: number
          example: 3
    UpdateAttendanceDto:
      type: object
      properties:
        checkedInAt:
          type: object
          example: '2026-04-10T19:05:00Z'
        isLate:
          type: object
          example: true
        attendanceType:
          type: string
          example: in_person
          enum:
            - in_person
            - remote
        answerCorrect:
          type: object
          example: true
        excusedAt:
          type: object
          example: null
        excuseType:
          type: string
          enum:
            - late
            - absent
          example: null
