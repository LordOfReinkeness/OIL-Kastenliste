services:
  app:
    container_name: oil-kastenliste-app-dev-ghcr
    image: ghcr.io/lordofreinkeness/oil-kastenliste:dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kastenliste
      DB_SYNCHRONIZE: "false"
      ADMIN_PASSWORD: changeme
      SESSION_SECRET: changeme
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: oil-kastenliste-db-ghcr
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kastenliste
    volumes:
      - kastenliste_ghcr_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    container_name: oil-kastenliste-backup-ghcr
    image: ghcr.io/lordofreinkeness/oil-kastenliste-backup:dev
    environment:
      PGPASSWORD: postgres
      DB_HOST: db
      DB_USER: postgres
      DB_NAME: kastenliste
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_RETAIN: ${BACKUP_RETAIN}
      BACKUP_PATH: /backups
    volumes:
      - ${BACKUP_HOST_PATH}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  kastenliste_ghcr_db:
