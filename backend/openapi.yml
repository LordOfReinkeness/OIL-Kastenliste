openapi: 3.0.0
paths:
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Logged in
        '401':
          description: Wrong password
      summary: Admin login
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: ''
      summary: Admin logout
      tags:
        - Auth
  /api/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
      summary: Check admin session status
      tags:
        - Auth
  /api/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Health
  /api/users:
    post:
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created
        '409':
          description: RZ ID already exists
      summary: Create a new user
      tags:
        - Users
    get:
      operationId: UsersController_findAll
      parameters: []
      responses:
        '200':
          description: List of users
      summary: List all users
      tags:
        - Users
  /api/users/validate-rz-id/{rzId}:
    get:
      operationId: UsersController_validateRzId
      parameters:
        - name: rzId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: '{ valid: boolean }'
      summary: Check whether an RZ ID matches the allowed format
      tags:
        - Users
  /api/users/lookup/{rzId}:
    get:
      operationId: UsersController_findByRzId
      parameters:
        - name: rzId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User ID and RZ ID
        '404':
          description: User not found
      summary: Look up user by RZ ID
      tags:
        - Users
  /api/users/{id}/stats:
    get:
      operationId: UsersController_getUserStats
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User stats
        '404':
          description: User not found
      summary: Get meeting stats for a user
      tags:
        - Users
  /api/users/{id}:
    get:
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User found
        '404':
          description: User not found
      summary: Get a user by UUID
      tags:
        - Users
    patch:
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated
        '404':
          description: User not found
      summary: Update a user
      tags:
        - Users
    delete:
      operationId: UsersController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found
      summary: Delete a user
      tags:
        - Users
  /api/meetings/t/{token}:
    get:
      operationId: TokenController_getMeeting
      parameters:
        - name: token
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting found
        '404':
          description: Meeting not found
      summary: Get meeting info by check-in token
      tags:
        - Token
  /api/meetings/t/{token}/live-checkin:
    post:
      operationId: TokenController_liveCheckIn
      parameters:
        - name: token
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveCheckinDto'
      responses:
        '200':
          description: Checked in
        '403':
          description: Live check-in window not open
        '404':
          description: User or meeting not found
        '409':
          description: Already checked in
      summary: Check in during the meeting
      tags:
        - Token
  /api/meetings/t/{token}/post-checkin:
    post:
      operationId: TokenController_postCheckIn
      parameters:
        - name: token
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCheckinDto'
      responses:
        '200':
          description: Checked in or wrong answer
        '403':
          description: Deadline passed or max retries reached
        '404':
          description: User or meeting not found
        '409':
          description: Already checked in or already checked in live
      summary: Post-meeting check-in before closing deadline
      tags:
        - Token
  /api/meetings/{id}/attendance:
    get:
      operationId: AttendanceController_getAttendance
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting with attendance list
        '404':
          description: Meeting not found
      summary: Get attendance for all users
      tags:
        - Attendance
  /api/meetings/{id}/attendance/{userId}:
    patch:
      operationId: AttendanceController_patchAttendance
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttendanceDto'
      responses:
        '200':
          description: Updated attendance record
        '404':
          description: Meeting or user not found
      summary: Override attendance for a user
      tags:
        - Attendance
  /api/meetings:
    post:
      operationId: MeetingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingDto'
      responses:
        '201':
          description: Meeting created
      summary: Create a new meeting
      tags:
        - Meetings
    get:
      operationId: MeetingsController_findAll
      parameters: []
      responses:
        '200':
          description: List of meetings
      summary: List all meetings
      tags:
        - Meetings
  /api/meetings/next:
    get:
      operationId: MeetingsController_findNext
      parameters: []
      responses:
        '200':
          description: Next meeting
        '404':
          description: No upcoming meeting
      summary: Get next upcoming meeting
      tags:
        - Meetings
  /api/meetings/next/excuse:
    post:
      operationId: MeetingsController_excuseNextMeeting
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcuseDto'
      responses:
        '200':
          description: Excuse submitted
        '404':
          description: No upcoming meeting or user not found
      summary: Submit an excuse for the next upcoming meeting
      tags:
        - Meetings
  /api/meetings/{id}:
    get:
      operationId: MeetingsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting found
        '404':
          description: Meeting not found
      summary: Get a meeting by UUID
      tags:
        - Meetings
    patch:
      operationId: MeetingsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingDto'
      responses:
        '200':
          description: Meeting updated
        '404':
          description: Meeting not found
      summary: Update a meeting
      tags:
        - Meetings
    delete:
      operationId: MeetingsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Meeting deleted
        '404':
          description: Meeting not found
      summary: Delete a meeting
      tags:
        - Meetings
  /api/admin/stats:
    get:
      operationId: AdminStatsController_getStats
      parameters: []
      responses:
        '200':
          description: Stats list
      summary: Full overview of all users, meetings, and scores
      tags:
        - AdminStats
  /api/admin/stats/export:
    get:
      operationId: AdminStatsController_export
      parameters:
        - name: format
          required: false
          in: query
          schema:
            enum:
              - csv
              - xlsx
            type: string
        - name: critical_missing
          required: false
          in: query
          schema:
            type: number
      responses:
        '200':
          description: ''
      summary: Download stats as CSV or XLSX
      tags:
        - AdminStats
info:
  title: Kastenliste OIL
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    LoginDto:
      type: object
      properties: {}
    CreateUserDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        firstName:
          type: string
          example: Lukas
        lastName:
          type: string
          example: Reinke
      required:
        - rzId
        - firstName
        - lastName
    UpdateUserDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        firstName:
          type: string
          example: Lukas
        lastName:
          type: string
          example: Reinke
    LiveCheckinDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        attendanceType:
          type: string
          example: in_person
          enum:
            - in_person
            - remote
      required:
        - rzId
        - attendanceType
    PostCheckinDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        answer:
          type: string
          example: deployment pipeline
      required:
        - rzId
    UpdateAttendanceDto:
      type: object
      properties:
        liveCheckedInAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-10T18:10:00Z'
        postCheckedInAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-10T19:05:00Z'
        isLate:
          type: boolean
          nullable: true
          example: true
        attendanceType:
          type: string
          enum:
            - in_person
            - remote
          nullable: true
          example: in_person
        answerCorrect:
          type: boolean
          nullable: true
          example: true
        excusedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        excuseType:
          type: string
          enum:
            - late
            - absent
          nullable: true
          example: null
    CreateMeetingDto:
      type: object
      properties:
        date:
          type: string
          example: '2026-04-10T18:00:00Z'
        excuseDeadlineMinutes:
          type: number
          example: 60
        checkinDeadline:
          type: string
          example: '2026-04-10T20:00:00Z'
        checkinWindowMinutes:
          type: number
          example: 60
        capInfractions:
          type: boolean
          example: false
        question:
          type: string
          example: What was the main topic?
        answer:
          type: string
          example: deployment pipeline
        checkAnswer:
          type: boolean
          example: true
        maxRetries:
          type: number
          example: 3
      required:
        - date
        - excuseDeadlineMinutes
        - checkinDeadline
    ExcuseDto:
      type: object
      properties:
        rzId:
          type: string
          example: lu451rei
        excuseType:
          type: string
          enum:
            - late
            - absent
          example: absent
        statusLastWeek:
          type: string
          description: Required when excuseType is absent
        statusNextWeek:
          type: string
          description: Required when excuseType is absent
        statusProblems:
          type: string
      required:
        - rzId
        - excuseType
    UpdateMeetingDto:
      type: object
      properties:
        date:
          type: string
          example: '2026-04-10T18:00:00Z'
        excuseDeadlineMinutes:
          type: number
          example: 60
        checkinDeadline:
          type: string
          example: '2026-04-10T20:00:00Z'
        question:
          type: string
          example: What was the main topic?
        answer:
          type: string
          example: deployment pipeline
        checkinWindowMinutes:
          type: number
          example: 60
        liveCheckinOpen:
          type: boolean
          example: false
        capInfractions:
          type: boolean
          example: false
        checkAnswer:
          type: boolean
          example: true
        maxRetries:
          type: number
          example: 3
