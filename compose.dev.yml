services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-kastenliste-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: kastenliste
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "false"
      DB_SYNCHRONIZE: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: oil-kastenliste-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kastenliste
    volumes:
      - kastenliste_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    build:
      context: ./backup-service
      dockerfile: Dockerfile
    container_name: oil-kastenliste-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_USER: postgres
      DB_NAME: kastenliste
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_RETAIN: ${BACKUP_RETAIN}
      BACKUP_PATH: /backups
    volumes:
      - ${BACKUP_HOST_PATH}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kastenliste_db:
